MOD_MESSE="Orari Messe"
MOD_MESSE_DESCRIPTION="Modulo widget per la visualizzazione degli orari delle Sante Messe"

; Parametri
MOD_MESSE_PARAM_CHIESA_ID="Chiesa da visualizzare"
MOD_MESSE_PARAM_CHIESA_ID_DESC="Seleziona la chiesa di cui visualizzare gli orari"
MOD_MESSE_PARAM_SHOW_NEXT_MASS="Mostra prossima messa"
MOD_MESSE_PARAM_SHOW_ORARI="Mostra tabella orari"
MOD_MESSE_PARAM_DAYS_WINDOW="Giorni finestra standard"
MOD_MESSE_PARAM_DAYS_PREFESTIVO="Giorni anticipo prefestive"
MOD_MESSE_PARAM_USA_SOGLIA_PREFESTIVA="Applica una fascia oraria alla prefestiva automatica"
MOD_MESSE_PARAM_USA_SOGLIA_PREFESTIVA_DESC="Se attivo (default), viene considerata prefestiva solo l'ultima messa feriale del giorno che rientra nella fascia oraria indicata. Se disattivo, viene sempre presa l'ultima messa feriale del giorno, qualunque sia il suo orario."
MOD_MESSE_PARAM_ORA_PREFESTIVO="Ora minima fascia prefestiva"
MOD_MESSE_PARAM_ORA_PREFESTIVO_DESC="Una messa feriale è considerata 'prefestiva' solo se il suo orario è compreso in questa fascia (es. dalle 16 alle 20)."
MOD_MESSE_PARAM_ORA_PREFESTIVO_MAX="Ora massima fascia prefestiva"
MOD_MESSE_PARAM_ORA_PREFESTIVO_MAX_DESC="Limite superiore della fascia oraria (es. 20 = fino alle 20:59)."
MOD_MESSE_PARAM_MOSTRA_GIORNO_PREFESTIVO="Mostra il giorno della settimana nelle Messe Prefestive"
MOD_MESSE_PARAM_MOSTRA_GIORNO_PREFESTIVO_DESC="Se disattivo (default), mostra solo l'orario (es. '17:30'). Se attivo, mostra anche il giorno della settimana di quella specifica occorrenza (es. '17:30 Giovedì')."
MOD_MESSE_PARAM_PERIODI_PREFESTIVA="Applica i periodi stagionali alla messa prefestiva"
MOD_MESSE_PARAM_PERIODI_PREFESTIVA_DESC="Se attivo (default), un periodo stagionale attivo quel giorno determina l'orario della prefestiva. Se disattivo, la prefestiva ignora sempre i periodi stagionali."
MOD_MESSE_PARAM_DAYS_SPECIALI="Giorni anticipo celebrazioni speciali"

