; Gestione Orari Messe by Gioacchino Cipriano
; Language: English — Module mod_messe

MOD_MESSE="Mass Schedule"
MOD_MESSE_DESCRIPTION="Widget module for displaying Mass schedules"

; Parameters
MOD_MESSE_PARAM_CHIESA_ID="Church to display"
MOD_MESSE_PARAM_CHIESA_ID_DESC="Select the church whose schedule you want to display"
MOD_MESSE_PARAM_SHOW_NEXT_MASS="Show next Mass"
MOD_MESSE_PARAM_SHOW_ORARI="Show schedule table"
MOD_MESSE_PARAM_DAYS_WINDOW="Standard window (days)"
MOD_MESSE_PARAM_DAYS_PREFESTIVO="Pre-feast days advance"
MOD_MESSE_PARAM_USA_SOGLIA_PREFESTIVA="Apply a time range to automatic vigil Mass"
MOD_MESSE_PARAM_USA_SOGLIA_PREFESTIVA_DESC="If enabled (default), only the last weekday Mass of the day that falls within the range below counts as vigil. If disabled, the last weekday Mass of the day is always used, regardless of its time."
MOD_MESSE_PARAM_ORA_PREFESTIVO="Minimum hour for vigil range"
MOD_MESSE_PARAM_ORA_PREFESTIVO_DESC="A weekday Mass is considered 'vigil' only if its time falls within this range (e.g. from 4 PM to 8 PM)."
MOD_MESSE_PARAM_ORA_PREFESTIVO_MAX="Maximum hour for vigil range"
MOD_MESSE_PARAM_ORA_PREFESTIVO_MAX_DESC="Upper bound of the time range (e.g. 20 = up to 8:59 PM)."
MOD_MESSE_PARAM_MOSTRA_GIORNO_PREFESTIVO="Show weekday in Vigil Masses list"
MOD_MESSE_PARAM_MOSTRA_GIORNO_PREFESTIVO_DESC="If off (default), only the time is shown (e.g. '5:30 PM'). If on, the weekday of that specific occurrence is also shown (e.g. '5:30 PM Thursday')."
MOD_MESSE_PARAM_PERIODI_PREFESTIVA="Apply seasonal periods to the vigil Mass"
MOD_MESSE_PARAM_PERIODI_PREFESTIVA_DESC="If enabled (default), an active seasonal period that day determines the vigil Mass time. If disabled, the vigil Mass always ignores seasonal periods."
MOD_MESSE_PARAM_DAYS_SPECIALI="Special celebrations advance"

; Frontend widget
MOD_MESSE_PROSSIMA="🕐 Next Holy Mass"
MOD_MESSE_ORE="at"
MOD_MESSE_GRUPPO_FERIALE="⛪ Weekday Masses"
MOD_MESSE_GRUPPO_PREFESTIVO="🕯️ Pre-feast Masses"
MOD_MESSE_GRUPPO_VIGILIA="🔔 Vigil Masses (Saturday)"
MOD_MESSE_GRUPPO_FESTIVO="✨ Sunday Masses"
MOD_MESSE_GRUPPO_PARTICOLARE="🌟 Special Celebrations"

; Test mode
MOD_MESSE_PARAM_TESTMODE="Test Mode"
MOD_MESSE_PARAM_TESTMODE_DESC="Enable test mode to simulate a specific date"
MOD_MESSE_PARAM_TEST_DATE="Test date"
MOD_MESSE_PARAM_TEST_DATE_DESC="Date and time to simulate (format: YYYY-MM-DD HH:MM)"
MOD_MESSE_TESTMODE_AVVISO="⚠️ Test active —"
