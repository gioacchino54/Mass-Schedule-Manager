; Component parameters
COM_MESSE_PARAMS_SHOW_NEXT_MASS="Show next Mass"
COM_MESSE_PARAMS_DAYS_WINDOW="Standard window (days)"
COM_MESSE_PARAMS_DAYS_PREFESTIVO="Pre-feast days advance"
COM_MESSE_PARAMS_USA_SOGLIA_PREFESTIVA="Apply a time range to automatic vigil Mass"
COM_MESSE_PARAMS_USA_SOGLIA_PREFESTIVA_DESC="Only applies to churches with Vigil Mode set to 'Last evening weekday Mass'. If enabled (default), only the last weekday Mass of the day that falls within the range below counts as vigil. If disabled, the last weekday Mass of the day is always used, regardless of its time."
COM_MESSE_PARAMS_ORA_PREFESTIVO="Minimum hour for vigil range"
COM_MESSE_PARAMS_ORA_PREFESTIVO_DESC="A weekday Mass is considered 'vigil' only if its time falls within this range (e.g. from 4 PM to 8 PM). If no Mass on that day falls within this range, no vigil Mass will be shown."
COM_MESSE_PARAMS_ORA_PREFESTIVO_MAX="Maximum hour for vigil range"
COM_MESSE_PARAMS_ORA_PREFESTIVO_MAX_DESC="Upper bound of the time range (e.g. 20 = up to 8:59 PM). Must be greater than or equal to the minimum hour."
COM_MESSE_PARAMS_MOSTRA_GIORNO_PREFESTIVO="Show weekday in Vigil Masses list"
COM_MESSE_PARAMS_MOSTRA_GIORNO_PREFESTIVO_DESC="If off (default), the 'Vigil Masses' list only shows the time (e.g. '5:30 PM'). If on, it also shows the weekday of that specific occurrence (e.g. '5:30 PM Thursday')."
COM_MESSE_PARAMS_PERIODI_PREFESTIVA="Apply seasonal periods to the vigil Mass"
COM_MESSE_PARAMS_PERIODI_PREFESTIVA_DESC="If enabled (default), when a seasonal period (e.g. 'Summer Schedule') is active that day, the vigil Mass is calculated on the seasonal schedule actually in effect, not the normal one. If disabled, the vigil Mass always ignores seasonal periods and is based only on the normally configured schedule."
COM_MESSE_PARAMS_DAYS_SPECIALI="Special celebrations advance"

