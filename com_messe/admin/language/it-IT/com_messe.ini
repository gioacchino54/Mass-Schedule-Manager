; Parametri componente
COM_MESSE_PARAMS_SHOW_NEXT_MASS="Mostra prossima messa"
COM_MESSE_PARAMS_DAYS_WINDOW="Giorni finestra standard"
COM_MESSE_PARAMS_DAYS_PREFESTIVO="Giorni anticipo prefestive"
COM_MESSE_PARAMS_USA_SOGLIA_PREFESTIVA="Applica una fascia oraria alla prefestiva automatica"
COM_MESSE_PARAMS_USA_SOGLIA_PREFESTIVA_DESC="Riguarda solo le chiese con Modalità Prefestiva impostata su 'Ultima messa feriale serale'. Se attivo (default), viene considerata prefestiva solo l'ultima messa feriale del giorno che rientra nella fascia oraria indicata sotto. Se disattivo, viene sempre presa l'ultima messa feriale del giorno, qualunque sia il suo orario."
COM_MESSE_PARAMS_ORA_PREFESTIVO="Ora minima fascia prefestiva"
COM_MESSE_PARAMS_ORA_PREFESTIVO_DESC="Una messa feriale viene considerata 'prefestiva' solo se il suo orario è compreso in questa fascia (es. dalle 16 alle 20). Se in quel giorno non c'è nessuna messa in questa fascia, non viene mostrata nessuna messa prefestiva."
COM_MESSE_PARAMS_ORA_PREFESTIVO_MAX="Ora massima fascia prefestiva"
COM_MESSE_PARAMS_ORA_PREFESTIVO_MAX_DESC="Limite superiore della fascia oraria (es. 20 = fino alle 20:59). Deve essere maggiore o uguale all'ora minima."
COM_MESSE_PARAMS_MOSTRA_GIORNO_PREFESTIVO="Mostra il giorno della settimana nelle Messe Prefestive"
COM_MESSE_PARAMS_MOSTRA_GIORNO_PREFESTIVO_DESC="Se disattivo (default), nell'elenco 'Messe Prefestive' viene mostrato solo l'orario (es. '17:30'). Se attivo, viene mostrato anche il giorno della settimana di quella specifica occorrenza (es. '17:30 Giovedì')."
COM_MESSE_PARAMS_PERIODI_PREFESTIVA="Applica i periodi stagionali alla messa prefestiva"
COM_MESSE_PARAMS_PERIODI_PREFESTIVA_DESC="Se attivo (default), quando un periodo stagionale (es. 'Orario Estivo') è attivo quel giorno, la messa prefestiva viene calcolata sull'orario stagionale realmente in vigore, non su quello normale. Se disattivo, la prefestiva ignora sempre i periodi stagionali e si basa solo sull'orario configurato normalmente."
COM_MESSE_PARAMS_DAYS_SPECIALI="Giorni anticipo celebrazioni speciali"

